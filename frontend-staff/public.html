<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Public Display - SmartQueue</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        .hidden { display: none !important; }
    </style>
</head>
<body class="bg-blue-900 text-white min-h-screen flex flex-col">

    <div id="setup-panel" class="absolute top-4 left-4 bg-white text-black p-4 rounded shadow-lg z-50">
        <h3 class="font-bold mb-2">Display Setup</h3>
        <input type="text" id="queue-id-input" placeholder="Enter Queue ID" value="11111111-1111-1111-1111-111111111111" class="border p-2 mb-2 w-full text-sm">
        <button id="btn-start" class="bg-blue-600 text-white px-4 py-2 rounded w-full">Start Display</button>
    </div>

    <div id="error-message" class="hidden bg-red-600 text-white p-4 text-center text-xl absolute top-0 w-full z-40">
        <span id="error-text"></span>
    </div>

    <header class="p-8 text-center border-b border-blue-800">
        <h1 class="text-5xl font-bold tracking-wider">GENERAL MEDICINE OPD</h1>
        <p class="text-blue-300 text-xl mt-2">Please wait for your token number</p>
    </header>

    <main class="flex-grow flex items-center justify-center p-8">
        <div class="grid grid-cols-1 lg:grid-cols-2 gap-16 w-full max-w-6xl">

            <!-- Currently Serving -->
            <div class="bg-white rounded-3xl p-12 text-center shadow-2xl flex flex-col justify-center items-center h-full">
                <h2 class="text-4xl text-gray-500 font-bold mb-4 uppercase tracking-widest">Currently Serving</h2>
                <div id="serving-token" class="text-8xl md:text-[10rem] font-black text-green-600 leading-none">
                    -
                </div>
            </div>

            <!-- Waiting / Next Info -->
            <div class="flex flex-col gap-8 h-full">
                <div class="bg-blue-800 rounded-3xl p-8 text-center flex-1 flex flex-col justify-center">
                    <h2 class="text-2xl text-blue-300 font-bold mb-2 uppercase">Next Token</h2>
                    <div id="next-token" class="text-6xl font-bold text-yellow-400">
                        -
                    </div>
                </div>

                <div class="bg-blue-800 rounded-3xl p-8 text-center flex-1 flex flex-col justify-center">
                    <h2 class="text-2xl text-blue-300 font-bold mb-2 uppercase">Total Waiting</h2>
                    <div id="waiting-count" class="text-6xl font-bold text-white">
                        0
                    </div>
                </div>
            </div>

        </div>
    </main>

    <footer class="p-4 text-center text-blue-400 text-sm border-t border-blue-800 flex justify-between px-8">
        <span>SmartQueue Display System</span>
        <span id="last-updated">Waiting for connection...</span>
    </footer>

    <script src="public.js"></script>
</body>
</html>
