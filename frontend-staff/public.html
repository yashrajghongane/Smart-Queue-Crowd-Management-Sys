<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Public Display - SmartQueue</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        .hidden { display: none !important; }
    </style>
</head>
<body class="bg-blue-900 text-white min-h-screen flex flex-col transition-colors duration-500">

    <div id="setup-panel" class="absolute top-4 left-4 bg-white text-slate-900 p-4 rounded-xl shadow-2xl z-50 border border-slate-200">
        <h3 class="font-bold text-sm mb-2 text-slate-800">Display Setup</h3>
        <label for="queue-id-input" class="block text-xs text-slate-500 mb-1">Queue ID:</label>
        <input type="text" id="queue-id-input" placeholder="Enter Queue UUID" value="3d3f0f52-6b7a-4bb3-92cb-7f1f4d340301" class="border border-slate-300 rounded px-3 py-1.5 mb-2 w-full text-xs font-mono text-slate-800">
        <button id="btn-start" class="bg-blue-600 hover:bg-blue-700 text-white text-xs font-semibold px-4 py-2 rounded-lg w-full">Start Display</button>
    </div>

    <div id="error-message" class="hidden bg-red-600 text-white p-3 text-center text-sm font-semibold absolute top-0 w-full z-40">
        <span id="error-text"></span>
    </div>

    <header class="p-8 text-center border-b border-blue-800">
        <p class="text-blue-300 text-sm font-semibold uppercase tracking-widest mb-1">SmartQueue Live Display</p>
        <h1 class="text-4xl sm:text-5xl font-extrabold tracking-wider">GENERAL MEDICINE OPD</h1>
        <p class="text-blue-200 text-base mt-2">Please proceed when your token number appears below</p>
    </header>

    <main class="flex-grow flex items-center justify-center p-6 sm:p-10">
        <div class="grid grid-cols-1 lg:grid-cols-2 gap-8 lg:gap-12 w-full max-w-6xl">

            <!-- Currently Serving -->
            <div class="bg-white rounded-3xl p-8 sm:p-12 text-center shadow-2xl flex flex-col justify-center items-center">
                <h2 class="text-2xl sm:text-3xl text-slate-500 font-bold mb-4 uppercase tracking-widest">Now Serving</h2>
                <div id="serving-token" class="text-7xl sm:text-9xl md:text-[10rem] font-black text-emerald-600 leading-none">
                    -
                </div>
            </div>

            <!-- Waiting / Next Info -->
            <div class="flex flex-col gap-6 justify-center">
                <div class="bg-blue-800/80 backdrop-blur rounded-3xl p-8 text-center border border-blue-700 shadow-xl flex-1 flex flex-col justify-center">
                    <h2 class="text-xl sm:text-2xl text-blue-200 font-bold mb-2 uppercase tracking-wide">Next Token</h2>
                    <div id="next-token" class="text-5xl sm:text-6xl font-black text-amber-300">
                        -
                    </div>
                </div>

                <div class="bg-blue-800/80 backdrop-blur rounded-3xl p-8 text-center border border-blue-700 shadow-xl flex-1 flex flex-col justify-center">
                    <h2 class="text-xl sm:text-2xl text-blue-200 font-bold mb-2 uppercase tracking-wide">Waiting Patients</h2>
                    <div id="waiting-count" class="text-5xl sm:text-6xl font-black text-white">
                        0
                    </div>
                </div>
            </div>

        </div>
    </main>

    <footer class="p-4 text-center text-blue-300 text-xs border-t border-blue-800 flex justify-between px-8">
        <div class="flex gap-4">
            <a href="/staff/" class="hover:underline text-blue-300">Staff dashboard</a>
            <a href="/patient/" class="hover:underline text-blue-300">Patient view</a>
        </div>
        <span id="last-updated">Waiting for connection...</span>
    </footer>

    <script src="public.js"></script>
</body>
</html>
