<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Staff Dashboard - SmartQueue</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        .hidden { display: none !important; }
    </style>
</head>
<body class="bg-gray-100 min-h-screen">
    <div class="container mx-auto p-4">
        <header class="flex justify-between items-center mb-6">
            <h1 class="text-2xl font-bold">Staff Dashboard</h1>
            <div class="flex gap-4 items-center">
                <span id="last-updated" class="text-sm text-gray-500"></span>
                <button id="btn-refresh" class="bg-gray-200 px-4 py-2 rounded">Refresh</button>
            </div>
        </header>

        <div id="error-message" class="hidden bg-red-100 border border-red-400 text-red-700 px-4 py-3 rounded relative mb-4">
            <span class="block sm:inline" id="error-text"></span>
        </div>

        <div class="grid grid-cols-1 md:grid-cols-2 gap-6">
            <!-- Digital Queue Section -->
            <div class="bg-white p-6 rounded-lg shadow">
                <h2 class="text-xl font-bold mb-4 border-b pb-2">Digital Queue</h2>
                <div class="mb-4">
                    <label class="block text-gray-700 text-sm font-bold mb-2">Queue ID:</label>
                    <input type="text" id="queue-id-input" value="11111111-1111-1111-1111-111111111111" class="shadow appearance-none border rounded w-full py-2 px-3 text-gray-700 leading-tight focus:outline-none focus:shadow-outline">
                </div>
                <div class="flex justify-between items-center bg-gray-50 p-4 rounded mb-4">
                    <div>
                        <p class="text-sm text-gray-500">Currently Serving</p>
                        <p id="serving-token" class="text-3xl font-bold text-blue-600">-</p>
                    </div>
                    <div>
                        <p class="text-sm text-gray-500">Waiting</p>
                        <p id="waiting-count" class="text-3xl font-bold text-orange-600">0</p>
                    </div>
                </div>

                <div class="flex flex-wrap gap-2 mb-4">
                    <button id="btn-call-next" class="bg-blue-500 hover:bg-blue-700 text-white font-bold py-2 px-4 rounded w-full mb-2">CALL NEXT</button>
                    <button id="btn-complete" class="bg-green-500 hover:bg-green-700 text-white font-bold py-2 px-4 rounded flex-1 disabled:opacity-50" disabled>COMPLETE</button>
                    <button id="btn-skip" class="bg-red-500 hover:bg-red-700 text-white font-bold py-2 px-4 rounded flex-1 disabled:opacity-50" disabled>SKIP</button>
                    <button id="btn-hold" class="bg-yellow-500 hover:bg-yellow-700 text-white font-bold py-2 px-4 rounded flex-1 disabled:opacity-50" disabled>HOLD</button>
                </div>

                <!-- We don't have a specific recall token input in UI, so let's just make it simple -->
                <div class="border-t pt-4">
                    <label class="block text-gray-700 text-sm font-bold mb-2">Recall Token ID:</label>
                    <div class="flex gap-2">
                        <input type="text" id="recall-token-id" placeholder="Token UUID" class="shadow appearance-none border rounded w-full py-2 px-3 text-gray-700 leading-tight focus:outline-none focus:shadow-outline">
                        <button id="btn-recall" class="bg-purple-500 hover:bg-purple-700 text-white font-bold py-2 px-4 rounded whitespace-nowrap">RECALL</button>
                    </div>
                </div>
            </div>

            <!-- Physical Occupancy Section -->
            <div class="bg-white p-6 rounded-lg shadow">
                <h2 class="text-xl font-bold mb-4 border-b pb-2">Physical Occupancy</h2>
                <div class="mb-4">
                    <label class="block text-gray-700 text-sm font-bold mb-2">Zone ID:</label>
                    <input type="text" id="zone-id-input" value="33333333-3333-3333-3333-333333333333" class="shadow appearance-none border rounded w-full py-2 px-3 text-gray-700 leading-tight focus:outline-none focus:shadow-outline">
                </div>

                <div class="flex flex-col items-center justify-center bg-gray-50 p-8 rounded mb-4">
                    <p class="text-lg text-gray-500 mb-2">Current Occupancy</p>
                    <div class="flex items-end gap-2">
                        <p id="zone-occupancy" class="text-6xl font-bold">0</p>
                        <p id="zone-capacity" class="text-xl text-gray-500 mb-2">/ 0</p>
                    </div>
                    <div id="capacity-alert" class="mt-4 px-4 py-1 rounded-full font-bold text-sm bg-gray-200 text-gray-700">
                        NORMAL
                    </div>
                </div>

                <div class="text-center">
                    <button id="btn-refresh-zone" class="bg-gray-200 hover:bg-gray-300 text-gray-800 font-bold py-2 px-4 rounded">Refresh Zone</button>
                </div>
            </div>
        </div>
    </div>
    <script src="app.js"></script>
</body>
</html>
