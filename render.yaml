services:
  # ── SmartQueue FastAPI Web Service ───────────────────────────────────────────
  - type: web
    name: smartqueue-api
    runtime: python
    region: oregon
    plan: free
    buildCommand: "cd backend && pip install -r requirements.txt && alembic upgrade head && python seed.py"
    startCommand: "cd backend && uvicorn app.main:app --host 0.0.0.0 --port $PORT"
    healthCheckPath: /health
    envVars:
      - key: ENVIRONMENT
        value: production
      - key: APP_NAME
        value: SmartQueue
      - key: APP_VERSION
        value: 0.1.0
      - key: DOCS_ENABLED
        value: "false"
      - key: DATABASE_URL
        fromDatabase:
          name: smartqueue-db
          property: connectionString
      - key: JWT_SECRET_KEY
        generateValue: true
      - key: JWT_ALGORITHM
        value: HS256
      - key: ACCESS_TOKEN_EXPIRE_MINUTES
        value: "480"
      - key: CORS_ORIGINS
        value: '["*"]'
      - key: RATE_LIMIT_ENABLED
        value: "true"

databases:
  # ── SmartQueue PostgreSQL Managed Database ──────────────────────────────────
  - name: smartqueue-db
    databaseName: smartqueue
    user: smartqueue_user
    region: oregon
    plan: free
