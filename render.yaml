services:
  # ── SmartQueue Production Web Service ─────────────────────────────────────────
  - type: web
    name: smartqueue-api
    runtime: python
    region: oregon
    plan: starter
    buildCommand: "cd backend && pip install -r requirements.txt"
    preDeployCommand: "cd backend && alembic upgrade head && python bootstrap_prod.py"
    startCommand: "cd backend && uvicorn app.main:app --host 0.0.0.0 --port $PORT"
    healthCheckPath: /health
    envVars:
      - key: ENVIRONMENT
        value: production
      - key: APP_NAME
        value: SmartQueue
      - key: APP_VERSION
        value: 0.1.0
      - key: DOCS_ENABLED
        value: "false"
      - key: DATABASE_URL
        fromDatabase:
          name: smartqueue-postgres
          property: connectionString
      - key: JWT_SECRET_KEY
        generateValue: true
      - key: JWT_ALGORITHM
        value: HS256
      - key: ACCESS_TOKEN_EXPIRE_MINUTES
        value: "480"
      - key: PATIENT_FRONTEND_URL
        value: "https://smartqueue-api.onrender.com/patient/"
      - key: CORS_ORIGINS
        value: '["https://smartqueue-api.onrender.com"]'
      - key: RATE_LIMIT_ENABLED
        value: "true"
      - key: ADMIN_PASSWORD
        generateValue: true
      - key: STAFF_PASSWORD
        generateValue: true
      - key: DEVICE_KEY
        generateValue: true

databases:
  # ── SmartQueue PostgreSQL Managed Database ──────────────────────────────────
  - name: smartqueue-postgres
    databaseName: smartqueue
    user: smartqueue_admin
    region: oregon
    plan: starter
